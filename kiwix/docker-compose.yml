---
services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - 'DOWNLOAD=https://download.kiwix.org/zim/wikipedia_bm_all.zim'
    volumes:
      - ./tmp/zim:/data
    command:
      - '*.zim'
    networks:
      - homelab-network

networks:
  homelab-network:
    external: true
