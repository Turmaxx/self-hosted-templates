---
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: page
    ports:
      - 3240:3000
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homelab-network
    restart: unless-stopped

networks:
  homelab-network:
    external: true
